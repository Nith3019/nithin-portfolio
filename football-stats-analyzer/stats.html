<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football G/A Analyzer | 2025/26</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #08080d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            text-align: center;
        }

        .label {
            color: #8b5cf6;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .season {
            color: #8b5cf6;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .description {
            color: #9999a8;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444452;
            background: #111118;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: rgba(139,92,246,0.08);
            border: 1px solid rgba(139,92,246,0.3);
        }

        #playerName {
            margin-bottom: 20px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .value {
            color: #8b5cf6;
            font-weight: bold;
        }

        .ratio {
            font-size: 28px;
            margin-top: 20px;
        }

        .back {
            display: block;
            margin-top: 25px;
            color: #9999a8;
            text-decoration: none;
        }

        .back:hover {
            color: #8b5cf6;
        }
    </style>
</head>

<body>

<div class="container">

    <p class="label">FOOTBALL ANALYZER</p>

    <h1>⚽ Player G/A Analyzer</h1>

    <p class="season">2025/26 SEASON</p>

    <p class="description">
        Search for a player to see their goals, assists and goal contributions.
    </p>

    <input
        type="text"
        id="playerInput"
        placeholder="Enter player name..."
    >

    <button onclick="searchPlayer()">Search Player</button>

    <div id="result">

        <h2 id="playerName"></h2>

        <div class="stat">
            <span>Goals</span>
            <span class="value" id="goals"></span>
        </div>

        <div class="stat">
            <span>Assists</span>
            <span class="value" id="assists"></span>
        </div>

        <div class="stat">
            <span>Goal Contributions</span>
            <span class="value" id="contributions"></span>
        </div>

        <div class="ratio">
            G/A Ratio: <span class="value" id="ratio"></span>
        </div>

    </div>

    <a class="back" href="../../index.html">← Back to Portfolio</a>

</div>

<script>
async function searchPlayer() {

    const name = document.getElementById("playerInput").value.trim();

    if (!name) {
        alert("Please enter a player name.");
        return;
    }

    const result = document.getElementById("result");

    result.style.display = "block";
    document.getElementById("playerName").textContent = "Searching...";

    try {

        const response = await fetch(
            `/api/player?name=${encodeURIComponent(name)}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Player not found");
        }

        document.getElementById("playerName").textContent =
            "📊 " + data.player;

        document.getElementById("goals").textContent =
            data.goals;

        document.getElementById("assists").textContent =
            data.assists;

        document.getElementById("contributions").textContent =
            data.goals + data.assists;

        document.getElementById("ratio").textContent =
            data.goals + data.assists;

    } catch (error) {

        document.getElementById("playerName").textContent =
            "❌ " + error.message;

        document.getElementById("goals").textContent = "";
        document.getElementById("assists").textContent = "";
        document.getElementById("contributions").textContent = "";
        document.getElementById("ratio").textContent = "";
    }
}
</script>

</body>
</html>
